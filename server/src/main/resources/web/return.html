<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Оплата · Subly</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<style>
  :root { --bg: #f5f5f7; --card: #fff; --ink: #1d1d1f; --muted: #6e6e73; --accent: #0071e3; --green: #34c759; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1c1c1e; --ink: #f5f5f7; --muted: #98989d; --accent: #2997ff; --green: #30d158; } }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 17px/1.47 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
         min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center; }
  .card { background: var(--card); border-radius: 28px; padding: 40px 28px; max-width: 420px; }
  .ok { width: 72px; height: 72px; border-radius: 50%; background: var(--green); margin: 0 auto 20px; position: relative; animation: pop .5s cubic-bezier(.2,1.4,.4,1); }
  .ok::after { content: ""; position: absolute; left: 25px; top: 17px; width: 16px; height: 30px; border: solid #fff; border-width: 0 5px 5px 0; transform: rotate(45deg); }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .ok { animation: none; } }
  h1 { font-size: 28px; letter-spacing: -0.02em; }
  p { color: var(--muted); margin-top: 10px; }
  a.btn { display: inline-block; margin-top: 26px; background: var(--accent); color: #fff; text-decoration: none; padding: 13px 28px; border-radius: 980px; font-weight: 500; }
</style>
</head>
<body>
  <div class="card">
    <div class="ok"></div>
    <h1>Спасибо!</h1>
    <p>Если оплата прошла, Subly Pro включится, как только вы вернётесь в приложение. Обычно это занимает несколько секунд.</p>
    <a class="btn" href="subly://billing">Вернуться в Subly</a>
    <p style="font-size:13px">Кнопка не сработала? Просто откройте приложение — оно само проверит оплату.</p>
  </div>
</body>
</html>
