name: Release

# GitHub Release с APK и jar-файлом сервера.
# Запуск: Actions → Release → Run workflow → версия (например, 1.0.1) — тег vX.Y.Z создастся сам.
# Или push тега vX.Y.Z. Ссылки releases/latest/download/subly.apk всегда ведут на последнюю версию.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Версия без v, например 1.0.1"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Server jar
        working-directory: server
        run: ./gradlew test buildFatJar --no-daemon
      - name: APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - run: |
          cp android/app/build/outputs/apk/release/app-release.apk subly.apk
          cp server/build/libs/subly-server.jar subly-server.jar
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          name: Subly ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            subly.apk
            subly-server.jar
          generate_release_notes: true
