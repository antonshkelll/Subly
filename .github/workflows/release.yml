name: Release

# Тег vX.Y.Z → GitHub Release с APK и jar-файлом сервера.
# Ссылки вида releases/latest/download/subly.apk работают всегда на последнюю версию.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Server jar
        working-directory: server
        run: ./gradlew test buildFatJar --no-daemon
      - name: APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - run: |
          cp android/app/build/outputs/apk/release/app-release.apk subly.apk
          cp server/build/libs/subly-server.jar subly-server.jar
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            subly.apk
            subly-server.jar
          generate_release_notes: true
