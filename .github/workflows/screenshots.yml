name: Screenshots

# Перерисовывает скриншоты экранов для README (без эмулятора: Robolectric + Roborazzi)
# и коммитит их в docs/screenshots.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/app/src/main/**", "android/app/src/test/**"]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Record
        working-directory: android
        run: ./gradlew recordRoborazziDebug --no-daemon
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet && echo "Скриншоты не изменились" && exit 0
          git commit -m "Обновить скриншоты экранов"
          git pull --rebase origin main
          git push
